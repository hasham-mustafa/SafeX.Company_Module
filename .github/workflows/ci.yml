name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SafeX.slnx

      - name: Build
        run: dotnet build SafeX.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test SafeX.CompanyPanel.Tests/SafeX.CompanyPanel.Tests.csproj --no-restore --configuration Release --verbosity normal